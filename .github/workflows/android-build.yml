name: PSX Mini Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "PSX-Mini-Source-0.3.0-dev.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found on the GitHub runner."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk --licenses || true
          "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.8"

      - name: Extract source archive
        run: |
          test -f "PSX-Mini-Source-0.3.0-dev.zip"
          mkdir -p source
          unzip -q "PSX-Mini-Source-0.3.0-dev.zip" -d source
          echo "Archive contents:"
          find source -maxdepth 3 -type f | sort | head -200

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          SETTINGS="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found in the source archive."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $PROJECT_DIR"

      - name: Refresh 16 KB alignment patch for pinned upstream source
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          mkdir -p patches
          cat > patches/pcsx-rearmed-16kb-page-alignment.patch <<'PATCH'
          --- a/jni/Android.mk
          +++ b/jni/Android.mk
          @@ -275,3 +275,4 @@
           LOCAL_LDFLAGS       += -Wl,--gc-sections
           LOCAL_LDFLAGS       += -Wl,-z,max-page-size=16384
          +LOCAL_LDFLAGS       += -Wl,-z,common-page-size=16384
           LOCAL_LDLIBS        := -lz -llog
          PATCH
          echo "16 KB linker patch refreshed for pinned PCSX ReARMed Android.mk."
          sed -n '273,280p' patches/pcsx-rearmed-16kb-page-alignment.patch

      - name: Build native core when build script is included
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f scripts/build_core_android.sh ]; then
            chmod +x scripts/build_core_android.sh
            ./scripts/build_core_android.sh
          else
            echo "::warning::scripts/build_core_android.sh is not present; native core build step skipped."
          fi

      - name: Migrate Kotlin JVM target to compilerOptions DSL
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          content = path.read_text()
          legacy = '    kotlinOptions {\n        jvmTarget = "17"\n    }\n'
          if legacy not in content:
              raise SystemExit("Expected legacy kotlinOptions block was not found; refusing an unsafe rewrite.")
          content = content.replace(legacy, "", 1)
          if "import org.jetbrains.kotlin.gradle.dsl.JvmTarget" not in content:
              content = "import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n\n" + content
          marker = "\ndependencies {"
          compiler_options = "\nkotlin {\n    compilerOptions {\n        jvmTarget.set(JvmTarget.fromTarget(\"17\"))\n    }\n}\n"
          if marker not in content:
              raise SystemExit("Could not find dependencies block for Kotlin compilerOptions insertion.")
          content = content.replace(marker, compiler_options + marker, 1)
          path.write_text(content)
          print("Migrated Kotlin JVM target to compilerOptions DSL.")
          PY

      - name: Fix imported game folder size lookup
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/psxmini/app/MainActivity.kt")
          content = path.read_text()
          old = "formatBytes(game.folderSize())"
          new = "formatBytes(game.folder.folderSize())"
          if old not in content:
              raise SystemExit("Expected ImportedGame folder-size call was not found; refusing an unsafe rewrite.")
          path.write_text(content.replace(old, new, 1))
          print("Fixed folderSize() receiver to use ImportedGame.folder.")
          PY

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: psx-mini-debug-apk
          path: |
            ${{ steps.project.outputs.dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
